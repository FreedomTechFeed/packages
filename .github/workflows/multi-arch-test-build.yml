name: Test and Build

# Vendored from openwrt/actions-shared-workflows/.github/workflows/multi-arch-test-build.yml@main
# (commit pinned at the time of vendoring) with three deliberate changes so PR CI
# gives REAL signal about tollgate-wrt and is not blocked by a known-broken
# upstream runtime test:
#
#   1. ALWAYS build tollgate-wrt. The upstream "Determine changed packages"
#      step only builds packages whose */Makefile changed; a workflow-only PR
#      (e.g. .github/workflows/*) would fall back to generic test packages
#      (vim attendedsysupgrade-common bmon) and give ZERO signal about
#      tollgate-wrt. This feed's sole purpose is tollgate-wrt, so we always
#      build it.
#
#   2. A MISSING runtime rootfs image now SKIPS, it does not go RED. Both docker
#      steps used to carry continue-on-error, so the whole runtime lane was
#      unreadable: a genuine runtime regression looked exactly like the known
#      noise. openwrt/rootfs:<arch>-<branch> is not published for every arch
#      (measured 2026-10-09 UTC with `docker manifest inspect` and the Docker Hub
#      tags API: x86_64, mips_24kc and aarch64_generic exist; aarch64_cortex-a53
#      -- an ACTIVE row of the matrix below -- aarch64_cortex-a72,
#      arm_cortex-a7, mipsel_24kc and mips64_octeonplus do not), and `docker
#      build` then dies
#      at its FROM line with "not found" (exit 1). The preflight step below
#      probes the tag and the two docker steps are gated on its result, so an
#      absent image is a clean SKIP.
#
#   3. The runtime TEST keeps continue-on-error: true, scoped to the ONE
#      documented upstream bug: openwrt/actions-shared-workflows#130.
#      Runtime-test containers are built from openwrt/rootfs:<arch>-<branch>
#      images that carry a kmods feed URL for the exact kernel they were built
#      with; when the branch moves to a newer kernel the old kmods dir is
#      removed and `opkg update` inside the container 404s. That is upstream
#      runtime-test infra, not a failure of our package. The BUILD phase (which
#      actually compiles tollgate-wrt) is the real gate.
#
#   4. SDK images are pinned to EXACT released versions (#60). The pin REMOVES a
#      per-job download: branch-tag images are snapshot-built and ship WITHOUT
#      the SDK, so every job downloaded ~260 MB (the exact-version images are
#      +415-430 MB larger precisely because they bundle it). The "Pin the SDK"
#      step now runs in 0 s. DO NOT expect a fast PR lane from this. The PR lane
#      is still ~31 min, because the remaining cost is the `Build` step's
#      dependency-closure rebuild -- measured 1200 s on run 38011377543, job
#      "Test x86_64" -- which is billed to Build, not to any download. Correct
#      wording: "download removed now; warm cache only from the second run on."
#      A pinned released image is what makes the buildx gha-cache scope stable
#      enough for a warm cache to be possible at all.
#
# The real build gate is release-publish.yml (tag-triggered, green) — this
# workflow is the PR-time signal. The runtime TEST step carries a DATED
# reminder saying when to delete the last escape hatch.

on:
  pull_request:

# Upstream parity: this stanza is verbatim from
# openwrt/actions-shared-workflows/.github/workflows/multi-arch-test-build.yml.
# The vendored copy previously dropped it, which had two real costs measured on
# 2026-10-08: (1) a stale "Test and Build" run on the merged PR branch kept
# occupying 7 runners for 160 minutes because nothing cancelled it — meanwhile
# the tag-triggered release-publish run queued 2 of its 16 jobs for 51 minutes
# at the 20-runner account cap; (2) rapid pushes to a PR each spawned a fresh
# 8-job matrix instead of superseding the previous one. On PRs
# (github.event_name == 'pull_request') this cancels the previous run in
# progress; upstream uses the same condition.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  build:
    name: Test ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # ------------------------------------------------------------------
      # PARKED rows — PR-lane compile coverage, trimmed 2026-10-08 (PR #54).
      # Product decision (operator): a PR push should compile the arches we
      # actually run on hardware, not all 8. These rows are NOT deleted:
      # uncomment a row (and re-add its trailing comma as needed) to restore
      # it. Full per-arch coverage for every shipped arch is unchanged on
      # the tag-triggered release lane (release-assets.py RELEASES), and
      # net/tollgate-wrt/test-feed-ci.sh Gate J enforces that a parked arch
      # is always still shipped by the release lane -- parking can never
      # become "this arch silently vanishes".
      #   {"arch": "aarch64_cortex-a72", "target": "bcm27xx-bcm2711", "runtime_test": true},
      #   {"arch": "aarch64_generic", "target": "armsr-armv8", "runtime_test": true},
      #   {"arch": "arm_cortex-a7", "target": "bcm27xx-bcm2709", "runtime_test": true},
      #   {"arch": "mipsel_24kc", "target": "mt7621", "runtime_test": false},
      #   {"arch": "mips64_octeonplus", "target": "octeon-generic", "runtime_test": true},
      #   {"arch": "mips_24kc", "target": "ath79-nand", "runtime_test": true},
      # ------------------------------------------------------------------
      # ACTIVE rows. DATED NOTE (2026-10-10, from the review of #59):
      # aarch64_cortex-a53 / mediatek-filogic is the GL-MT6000 BENCH arch and an
      # ACTIVE row here, but upstream does NOT publish
      # openwrt/rootfs:aarch64_cortex-a53-openwrt-25.12, so its runtime smoke
      # test SKIPS on EVERY run -- loudly, via the ::warning:: and job summary in
      # the availability preflight below. It is the arch we most want a runtime
      # signal for and the one that has none: this is a known, accepted gap, not
      # a green result. DELETE THIS NOTE (and expect real runtime coverage for
      # a53 to start reporting) once upstream publishes the image. Check with:
      #   curl -fsS https://hub.docker.com/v2/repositories/openwrt/rootfs/tags/aarch64_cortex-a53-openwrt-25.12
      # ------------------------------------------------------------------
      matrix: >-
        ${{ fromJSON('{"include": [
          {"arch": "aarch64_cortex-a53", "target": "mediatek-filogic", "runtime_test": true},
          {"arch": "mips_24kc", "target": "ath79-generic", "runtime_test": true},
          {"arch": "x86_64", "target": "x86-64", "runtime_test": true}
        ]}')}}

    steps:
      - name: Remove unused Android SDK, .NET, Swift, GHC
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Build the captive-portal + admin SPAs from the pinned portal commit
      # (build-in-CI rule #335) and stage them into net/tollgate-wrt/files/.
      # gh-action-sdk mounts this workspace as /feed, so the Makefile's install
      # recipe consumes what this step produced. No built asset is committed.
      - name: Build captive-portal/admin bundle
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build + stage portal bundle
        run: |
          set -euo pipefail
          bash net/tollgate-wrt/scripts/build-portal-bundle.sh

      # SDK BRANCH PIN — a RELEASED OpenWrt branch, never the mutable
      # snapshots/ tree (`master`).
      #
      # Measured 2026-10-01, PR #46, run 36842992536, job "Test aarch64_cortex-a72":
      # the job fetched targets/bcm27xx/bcm2711/sha256sums at 09:30:57 and the
      # 266 MB SDK tarball finished downloading at 09:42:31 — 12 minutes later.
      # Upstream rotates snapshots continuously, so by the time the tarball
      # landed it no longer matched the sums that had just been fetched, and the
      # verify step inside openwrt/gh-action-sdk@v11 failed:
      #     openwrt-sdk-...tar.zst: FAILED
      #     sha256sum: WARNING: 1 computed checksum did NOT match
      # 7 of the 8 arch jobs passed on that run; only the one whose SDK rotated
      # mid-download died. The failure is a property of the MUTABLE tree and can
      # strike any run on any arch, at the cost of a full ~30-minute job.
      #
      # A released version is immutable: releases/<version>/targets/<target>/
      # sha256sums and the SDK tarball it describes never change, so verifying a
      # download against them cannot race. Release-branch SDKs are already used
      # in this repo by release-publish.yml (the openwrt-24.10 lane), so this is
      # the same mechanism, not a new one.
      #
      # This replaces the previous "mirror the base branch" default, whose
      # `master` fallback IS the mutable tree. The guard below fails the job
      # loudly instead of silently building against a snapshot, and
      # net/tollgate-wrt/test-feed-ci.sh Gate H asserts the pin (with a negative
      # control that refuses a revert to `master`).
      #
      # The runtime-test container further down pulls
      # openwrt/rootfs:<arch>-<branch>; that step is gated on a preflight which
      # proves the tag exists, and the only remaining continue-on-error is scoped
      # to the documented upstream bug (openwrt/actions-shared-workflows#130), so
      # this pin does not weaken the gate — the Build phase is the gate.
      - name: Pin the SDK to an exact released version (bundled-SDK image)
        run: |
          SDK_BRANCH="25.12.5"
          case "$SDK_BRANCH" in
            main|master|snapshot*|"")
              echo "::error::SDK_BRANCH='$SDK_BRANCH' is a mutable snapshot tree. The SDK checksum race documented above (PR #46) returns with it: a snapshot's sha256sums can rotate between the sums fetch and the tarball download, failing this job for reasons unrelated to any PR. Pin an exact released version (major.minor.patch) instead."
              exit 1
              ;;
            openwrt-*)
              echo "::error::SDK_BRANCH='$SDK_BRANCH' is a BRANCH tag, not a release. ghcr.io/openwrt/sdk branch-tag images are snapshot-built and ship WITHOUT the SDK (gh-action-sdk entrypoint: 'snapshot containers don't ship with the SDK to save bandwidth'), so every job still downloads the ~260 MB tarball from the OpenWrt mirrors -- measured 2026-10-08, run 37839847702: the openwrt-25.12 apk-lane job spent 10,434 s on that download, the openwrt-24.10 ipk-lane job 3 h 38 m. Exact-version images (e.g. 25.12.5) bundle the SDK: no download, and the buildx gha-cache scope stays stable."
              exit 1
              ;;
          esac
          case "$SDK_BRANCH" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::SDK_BRANCH='$SDK_BRANCH' is not an exact released OpenWrt version (major.minor.patch, e.g. 25.12.5). Branch tags and snapshots are refused above." && exit 1 ;;
          esac
          echo "Building against the exact released SDK $SDK_BRANCH (image bundles the SDK)"
          echo "BRANCH=$SDK_BRANCH" >> $GITHUB_ENV

      # This feed's sole purpose is tollgate-wrt. Always build it so every PR
      # gives real signal about the package regardless of which paths changed.
      # (The upstream shared workflow only builds packages whose */Makefile
      # changed, so a workflow-only PR would build generic test packages and
      # give ZERO signal about tollgate-wrt.)
      - name: Determine packages
        run: |
          PACKAGES="tollgate-wrt"
          echo "Building $PACKAGES"
          echo "PACKAGES=$PACKAGES" >> $GITHUB_ENV

      - name: Build
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}-${{ env.BRANCH }}
          FEEDNAME: packages_ci
          INDEX: 1
          V: s

      - name: Move created packages to project dir
        if: always()
        run: cp -v bin/packages/${{ matrix.arch }}/packages_ci/* . || true

      - name: Collect metadata
        if: always()
        run: |
          MERGE_ID=$(git rev-parse --short HEAD)
          echo "MERGE_ID=$MERGE_ID" >> $GITHUB_ENV
          echo "BASE_ID=$(git rev-parse --short HEAD^1)" >> $GITHUB_ENV
          echo "HEAD_ID=$(git rev-parse --short HEAD^2)" >> $GITHUB_ENV
          PRNUMBER=${GITHUB_REF_NAME%/merge}
          echo "PRNUMBER=$PRNUMBER" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${{matrix.arch}}-PR$PRNUMBER-$MERGE_ID" >> $GITHUB_ENV

      - name: Generate metadata
        if: always()
        run: |
          cat << _EOF_ > PKG-INFO
          Metadata-Version: 2.1
          Name: ${{env.ARCHIVE_NAME}}
          Version: $BRANCH
          Author: $GITHUB_ACTOR
          Home-page: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PRNUMBER
          Download-URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Summary: $PACKAGES
          Platform: ${{ matrix.arch }}

          Packages for OpenWrt $BRANCH running on ${{matrix.arch}}, built from PR $PRNUMBER
          at commit $HEAD_ID, against $BRANCH at commit $BASE_ID, with merge SHA $MERGE_ID.

          Modified packages:
          _EOF_
          for p in $PACKAGES
          do
            echo "  "$p >> PKG-INFO
          done
          echo >> PKG-INFO
          echo Full file listing: >> PKG-INFO
          ls -al *.ipk >> PKG-INFO || true
          ls -al *.apk >> PKG-INFO || true
          cat PKG-INFO

      - name: Store packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARCHIVE_NAME}}-packages
          path: |
            Packages
            Packages.*
            *.ipk
            packages.adb
            *.apk
            PKG-INFO

      - name: Store logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARCHIVE_NAME}}-logs
          path: |
            logs/
            PKG-INFO

      - name: Remove logs
        if: always()
        run: sudo rm -rf logs/ || true

      - name: Check if any packages were built
        run: |
          if [ -n "$(find . -maxdepth 1 -type f -name '*.apk' -print -quit)" ]; then
            echo "Found *.apk files"
            HAVE_PKGS=true
            PKG_MANAGER=apk
          elif [ -n "$(find . -maxdepth 1 -type f -name '*.ipk' -print -quit)" ]; then
            echo "Found *.ipk files"
            HAVE_PKGS=true
            PKG_MANAGER=opkg
          else
            echo "No *.apk or *.ipk files found"
            HAVE_PKGS=false
          fi
          echo "HAVE_PKGS=$HAVE_PKGS" >> $GITHUB_ENV
          echo "PKG_MANAGER=$PKG_MANAGER" >> $GITHUB_ENV

      - name: Register QEMU
        if: ${{ matrix.runtime_test && fromJSON(env.HAVE_PKGS) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --import

      # Upstream PARITY, restored 2026-10-10: this checkout list must match the
      # one in openwrt/actions-shared-workflows' own multi-arch-test-build.yml,
      # because Dockerfile.feeds ADDs every file it fetches. Upstream added
      # scripts/sysctl.init (commit 483a355b2e, 2026-09-21) to BOTH the
      # Dockerfile and its own sparse-checkout list; our vendored list lagged one
      # file behind, so `docker build` failed for every arch whose rootfs image
      # DOES exist with:
      #   #8 [4/4] ADD scripts/sysctl.init /etc/init.d/sysctl
      #   ERROR: ... "/scripts/sysctl.init": not found
      # (measured 2026-10-09, run 37999768278, jobs Test x86_64 and Test
      # mips_24kc -- both exit 1). That failure has nothing to do with a missing
      # image, so the image preflight below could not have covered it. The three
      # shared scripts are never replaced locally; only the path list is made
      # identical to upstream's.
      - name: Checkout test scripts
        if: ${{ matrix.runtime_test && fromJSON(env.HAVE_PKGS) }}
        uses: actions/checkout@v7
        with:
          repository: openwrt/actions-shared-workflows
          path: workflow_context
          sparse-checkout: |
            .github/scripts/ci_helpers.sh
            .github/dockerfiles/Dockerfile.feeds
            .github/scripts/test_entrypoint.sh
            .github/scripts/sysctl.init
          sparse-checkout-cone-mode: false

      # PREFLIGHT: does openwrt/rootfs:<arch>-<branch> exist at all?
      #
      # Everything below builds on a rootfs image we do not control and upstream
      # does not publish for every arch. Measured 2026-10-09 on PR #57 (run
      # 37999768278, job "Test aarch64_cortex-a53" -- an ACTIVE row of the matrix
      # above) the container build died at the FROM line with
      #   ERROR: docker.io/openwrt/rootfs:aarch64_cortex-a53-openwrt-25.12: not found
      # and, because the container was then never built, the run below failed with
      #   Unable to find image 'test-container:latest' locally ... exit code 125.
      # Both were invisible because continue-on-error painted over them. Probing
      # the tag first turns an absent image into an explicit SKIP.
      #
      # `docker manifest inspect` is a registry round-trip that needs no daemon
      # pull; the Docker Hub tag API is the fallback for the runs where the
      # registry answers 401/429 for an anonymous client. Both are existence
      # probes, and a false negative costs one skipped smoke test -- it can never
      # turn a broken build green, because a wrong `available=true` still has to
      # survive the real `docker build`.
      - name: Check runtime-test rootfs image availability
        id: runtime_image
        if: ${{ matrix.runtime_test && fromJSON(env.HAVE_PKGS) }}
        run: |
          IMAGE="openwrt/rootfs:${{ matrix.arch }}-${{ env.BRANCH }}"
          available=false
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            available=true
          elif curl -fsSL --max-time 30 \
                 "https://hub.docker.com/v2/repositories/openwrt/rootfs/tags/${{ matrix.arch }}-${{ env.BRANCH }}" \
                 >/dev/null 2>&1; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "runtime-test image $IMAGE -> available=$available"
          # A SKIP must be LOUD. This lane already carries one deliberately
          # silenced step (continue-on-error on the runtime TEST, scoped to
          # openwrt/actions-shared-workflows#130), so a quiet skip is
          # indistinguishable from a pass on a dashboard. Measured 2026-10-10:
          # aarch64_cortex-a53 -- the GL-MT6000 BENCH arch, an ACTIVE matrix row
          # below -- has no published rootfs image, so its runtime test skips on
          # EVERY run. That is a permanent coverage gap and must be visible.
          if [ "$available" = "false" ]; then
            echo "::warning title=runtime lane SKIPPED for ${{ matrix.arch }}::openwrt/rootfs:${{ matrix.arch }}-${{ env.BRANCH }} is not published upstream, so the runtime smoke test was SKIPPED (not failed) -- a COVERAGE GAP, not a pass."
            {
              echo "### Runtime lane SKIPPED for ${{ matrix.arch }}"
              echo ""
              echo "\`openwrt/rootfs:${{ matrix.arch }}-${{ env.BRANCH }}\` is not published upstream,"
              echo "so the runtime smoke test did not run for this arch."
              echo ""
              echo "**This is a coverage gap, not a pass.** See the dated note on the matrix row."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Runtime-test container build. This step IS blocking again: the one cause
      # that used to justify continue-on-error here (a missing rootfs image) is
      # now the preflight's business, and it is a SKIP rather than a failure. What
      # is left is upstream runtime-test infra that can genuinely regress, so it
      # must be able to say so. The BUILD phase (which actually compiles
      # tollgate-wrt) remains the gate for the package itself.
      - name: Build Docker container
        if: ${{ matrix.runtime_test && fromJSON(env.HAVE_PKGS) && steps.runtime_image.outputs.available == 'true' }}
        run: |
          docker build \
            --build-arg ARCH \
            --file workflow_context/.github/dockerfiles/Dockerfile.feeds \
            --platform linux/${{ matrix.arch }} \
            --tag test-container \
            workflow_context/.github
        env:
          ARCH: ${{ matrix.arch }}-${{ env.BRANCH }}

      # Runtime smoke test. This is the ONLY remaining continue-on-error in this
      # workflow, and it is scoped to the ONE documented upstream bug:
      # openwrt/actions-shared-workflows#130 — the runtime-test rootfs image
      # carries a kmods feed URL for the exact kernel it was built with; when the
      # branch moves to a newer kernel that kmods directory is removed from the
      # download server and `opkg update` inside the container fails (the
      # entrypoint runs it under `set -o errexit`), so the runtime test fails even
      # though the package built fine. Upstream's own fix is open as PR #130,
      # "ci: test_entrypoint: drop the kmods feed before installing packages".
      #
      # The hatch is deliberately NARROW. It does not cover a missing rootfs image
      # (the preflight above SKIPs those) nor a failed container build (blocking
      # again). A red here for any reason other than the kmods feed IS a real
      # signal.
      #
      # REMINDER — DELETE THIS ESCAPE HATCH BY 2026-12-01.
      # Re-check https://github.com/openwrt/actions-shared-workflows/pull/130
      # (open + draft since 2026-08-13; last touched 2026-09-20). Once it lands,
      # `continue-on-error` must go: a runtime lane that can never block cannot
      # catch a real runtime regression, which is the whole reason this lane
      # exists. Gate E of net/tollgate-wrt/test-feed-ci.sh asserts the scope of
      # this hatch and the presence of this reminder, so the removal is a visible
      # change rather than a silently forgotten one.
      - name: Test via Docker container
        if: ${{ matrix.runtime_test && fromJSON(env.HAVE_PKGS) && steps.runtime_image.outputs.available == 'true' }}
        continue-on-error: true
        run: |
          docker run \
            -e ENABLE_GENERIC_TESTS=true \
            -e FORCE_GENERIC_TESTS=true \
            -e PKG_MANAGER=${{ env.PKG_MANAGER }} \
            --platform linux/${{ matrix.arch }} \
            --rm \
            --volume $GITHUB_WORKSPACE:/ci \
            test-container
