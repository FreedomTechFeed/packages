name: Publish per-arch tollgate-wrt release assets

# Builds tollgate-wrt for every arch the wizard can select (see
# net4sats-wizard-go arch.go) and uploads the resulting .apk / .ipk as
# release assets with deterministic names:
#
#   tollgate-wrt_<PKG_VERSION>_<arch>.apk
#   tollgate-wrt_<PKG_VERSION>_<arch>.ipk
#
# e.g. tollgate-wrt_0.6.0_alpha4_pre16_aarch64_cortex-a53.apk
#
# The wizard's tollgateArchAssets map (arch.go) points at these stable URLs,
# so the correct binary is fetched for the detected router arch.
#
# Two SDK images are built per arch:
#   - master        -> apk-tools package (.apk), OpenWrt 25+
#   - openwrt-24.10 -> opkg package (.ipk), OpenWrt <=24.x
# This mirrors how the wizard selects .apk vs .ipk by package manager.
#
# Build jobs run in parallel and upload their per-arch asset as a workflow
# artifact; a single publish job (needs: build) downloads them all and uploads
# to the release. This avoids the race of several matrix jobs calling
# softprops/action-gh-release concurrently.
#
# Offline dependency bundles (WAN-less install) — the ordering that matters:
#   A freshly flashed router with NO uplink has no apk indexes, so the
#   `DEPENDS:=+nodogsplash +jq` of the package cannot resolve. The
#   `offline-bundle` job therefore builds, per arch,
#   `tollgate-wrt-<PKG_VERSION>-<arch>-offline.tar.gz` (pkgs/ + MANIFEST.sha256
#   + install-offline.sh + README.md) from the PUBLISHED apk indexes of the
#   release it targets, and the publish job downloads those bundles BEFORE it
#   generates and signs SHA256SUMS. That order is the point: a bundle built
#   after signing is not covered by the signature and has no provenance. The
#   bundle names are part of the expected asset set (release-assets.py), so the
#   "Refuse to publish a release outside the expected asset set" gate below
#   refuses a release whose bundle is missing, and the acceptance check at the
#   end re-verifies the bundle from the public URL like every other asset.
#
# Release integrity (audit finding C3-05) — what the publish job guarantees:
#   1. It publishes a SHA256SUMS manifest covering EVERY asset of the release,
#      generated from the bytes it is about to upload (see
#      .github/workflows/scripts/release-manifest.sh).
#   2. It signs that manifest (SSHSIG, ed25519) with the key in the
#      FEED_SIGNING_KEY secret, and fails if the key is absent — an unsigned
#      manifest is refused. The public half is committed at
#      .github/release-keys/release-signing.pub, so the digest is
#      authenticated and no longer travels only with the bytes it describes.
#   3. It fails if the staged asset set is not EXACTLY the expected set derived
#      from .github/workflows/scripts/release-assets.py (same table that builds
#      the matrix), and if the release already carries an unmanaged asset — a
#      partially-published or hand-patched release cannot slip out unchecked.
#   4. The release object stays a DRAFT until every package AND the manifest
#      have been uploaded, then is published in one step. The ordering
#      constraint behind C3-05 is therefore enforced: there is no window in
#      which the tag resolves for an installer while SHA256SUMS 404s.
#   5. After publishing, it re-downloads the manifest AND every asset from the
#      public release URL and verifies the manifest against those bytes, so a
#      green run is evidence about what the public URL actually serves.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    name: Derive the expected asset set
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.assets.outputs.matrix }}
      offline_matrix: ${{ steps.assets.outputs.offline_matrix }}
      expected: ${{ steps.assets.outputs.expected }}
      version: ${{ steps.assets.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive the build matrix and the expected asset names
        id: assets
        run: |
          set -euo pipefail
          VERSION=$(grep '^PKG_VERSION:=' net/tollgate-wrt/Makefile | sed 's/^PKG_VERSION:=//')
          echo "PKG_VERSION=$VERSION"
          MATRIX=$(python3 .github/workflows/scripts/release-assets.py matrix)
          OFFLINE_MATRIX=$(python3 .github/workflows/scripts/release-assets.py offline-matrix)
          {
            echo "matrix=$MATRIX"
            echo "offline_matrix=$OFFLINE_MATRIX"
            echo "version=$VERSION"
            echo "expected<<EXPECTED_ASSETS_EOF"
            python3 .github/workflows/scripts/release-assets.py expected "$VERSION"
            echo "EXPECTED_ASSETS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "--- offline bundle matrix"
          echo "$OFFLINE_MATRIX"
          echo "--- expected assets"
          python3 .github/workflows/scripts/release-assets.py expected "$VERSION"

  build:
    name: Build ${{ matrix.arch }} (${{ matrix.sdk }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false so one broken arch does not cancel the others; the
      # publish job is gated on this job overall, so a failed arch still means
      # NO release is published (and no partial manifest can be).
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Build captive-portal + admin SPAs from the pinned portal commit and
      # stage into net/tollgate-wrt/files/ (build-in-CI rule #335). gh-action-sdk
      # mounts this workspace as /feed, so the Makefile consumes what this staged.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build + stage portal bundle
        run: |
          set -euo pipefail
          bash net/tollgate-wrt/scripts/build-portal-bundle.sh

      - name: Build tollgate-wrt with SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: tollgate
          PACKAGES: tollgate-wrt
          INDEX: 1
          V: s

      - name: Stage per-arch asset
        run: |
          set -euo pipefail
          PKG_VERSION=$(grep '^PKG_VERSION:=' net/tollgate-wrt/Makefile | sed 's/^PKG_VERSION:=//')
          echo "PKG_VERSION=$PKG_VERSION"
          # gh-action-sdk moves bin/ into the workspace (artifacts_dir).
          PKG_DIR="bin/packages/${{ matrix.arch }}/tollgate"
          echo "PKG_DIR=$PKG_DIR"
          ls -la "$PKG_DIR" || true
          PKG_FILE=$(find "$PKG_DIR" -maxdepth 1 -type f -name "tollgate-wrt*.${{ matrix.ext }}" | head -n1)
          if [ -z "$PKG_FILE" ]; then
            echo "::error::no tollgate-wrt .${{ matrix.ext }} produced for ${{ matrix.arch }}"
            exit 1
          fi
          ASSET="tollgate-wrt_${PKG_VERSION}_${{ matrix.arch }}.${{ matrix.ext }}"
          cp "$PKG_FILE" "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          ls -lh "$ASSET"

      - name: Upload per-arch artifact
        uses: actions/upload-artifact@v7
        with:
          name: tollgate-wrt-${{ matrix.arch }}-${{ matrix.ext }}
          path: tollgate-wrt_*_${{ matrix.arch }}.${{ matrix.ext }}
          if-no-files-found: error

  offline-bundle:
    name: Build offline dependency bundle (${{ matrix.arch }})
    needs: [preflight, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.offline_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the tollgate-wrt package for ${{ matrix.arch }}
        uses: actions/download-artifact@v7
        with:
          name: tollgate-wrt-${{ matrix.arch }}-${{ matrix.ext }}
          path: staged

      # The installer ships INSIDE the bundle and is NOT a single file: the
      # driver also needs its router-side companion (install-router.sh) and the
      # management keepalive seed, and it refuses to install without them. So the
      # whole pinned scripts/offline/ directory is fetched at a COMMIT (never a
      # branch) and the job fails closed when it cannot be fetched.
      - name: Fetch the pinned offline installer (OFFLINE-BUNDLE-2)
        env:
          INSTALLER_REPO: OpenTollGate/physical-router-test-automation
          INSTALLER_PATH: scripts/offline
          INSTALLER_REF: ${{ vars.OFFLINE_INSTALLER_REF || 'SET-ME-to-the-OFFLINE-BUNDLE-2-commit' }}
        run: |
          set -euo pipefail
          echo "pinned installer ref: ${INSTALLER_REPO}@${INSTALLER_REF}:${INSTALLER_PATH}"
          mkdir -p installer-repo && cd installer-repo
          git init -q .
          git remote add origin "https://github.com/${INSTALLER_REPO}.git"
          if ! git fetch -q --depth 1 origin "${INSTALLER_REF}"; then
            echo "::error::could not fetch ${INSTALLER_REF} from ${INSTALLER_REPO}"
            echo "::error::the WAN-less bundle ships the ordered installer, so it cannot be built without it. Land OFFLINE-BUNDLE-2 in ${INSTALLER_REPO} and set the repository variable OFFLINE_INSTALLER_REF to its merge commit."
            exit 1
          fi
          git checkout -q FETCH_HEAD -- "${INSTALLER_PATH}"
          test -s "${INSTALLER_PATH}/install-offline.sh"
          test -s "${INSTALLER_PATH}/install-router.sh"
          test -s "${INSTALLER_PATH}/templates/99z-mgmt-keepalive"
          for f in install-offline.sh install-router.sh templates/99z-mgmt-keepalive; do
            echo "${f} sha256: $(sha256sum "${INSTALLER_PATH}/${f}" | awk '{print $1}')"
          done
          echo "installer commit: $(git rev-parse FETCH_HEAD)"

      - name: Resolve, verify and package the offline dependency bundle
        run: |
          set -euo pipefail
          TOLLGATE_APK=$(find staged -maxdepth 2 -type f -name 'tollgate-wrt_*.apk' | head -n1)
          if [ -z "$TOLLGATE_APK" ]; then
            echo "::error::no tollgate-wrt .apk was staged for ${{ matrix.arch }}"
            exit 1
          fi
          echo "tollgate package: $TOLLGATE_APK"
          python3 .github/workflows/scripts/offline-bundle.py build \
            --cache-dir "$RUNNER_TEMP/offline-cache" \
            --release "${{ matrix.release }}" \
            --arch "${{ matrix.arch }}" \
            --target "${{ matrix.target }}" \
            --profile "${{ matrix.profile }}" \
            --pkg-version "${{ needs.preflight.outputs.version }}" \
            --tollgate-apk "$TOLLGATE_APK" \
            --installer-dir installer-repo/scripts/offline \
            --out out
          ls -lh out/

      - name: Upload the offline bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: offline-bundle-${{ matrix.arch }}
          path: out/*-offline.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release assets + SHA256SUMS
    needs: [preflight, build, offline-bundle]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      EXPECTED_ASSETS: ${{ needs.preflight.outputs.expected }}
    steps:
      - uses: actions/checkout@v7

      - name: Download all per-arch assets
        uses: actions/download-artifact@v7
        with:
          pattern: tollgate-wrt-*
          path: assets
          merge-multiple: true

      # BEFORE the manifest is generated and signed: the signed SHA256SUMS is
      # what gives the bundle its provenance, and it can only cover bytes that
      # are already staged here. offline-bundle-test.sh asserts this ordering,
      # including against a mutated copy of this file.
      - name: Download the offline bundles
        uses: actions/download-artifact@v7
        with:
          pattern: offline-bundle-*
          path: assets
          merge-multiple: true

      - name: List staged assets
        run: ls -lh assets/

      - name: Refuse to publish a release outside the expected asset set
        run: |
          set -euo pipefail
          printf '%s\n' "$EXPECTED_ASSETS" > expected-assets.txt
          # An asset already attached to this release that the matrix does not
          # know about cannot be covered by a regenerated manifest. Stop, so a
          # hand-patched release is repaired deliberately rather than silently
          # re-checksummed.
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' 2>/dev/null | grep -vE '^SHA256SUMS(\.sig)?$' || true)
          if [ -n "$existing" ]; then
            unexpected=$(comm -13 <(sort expected-assets.txt) <(printf '%s\n' "$existing" | sort) || true)
            if [ -n "$unexpected" ]; then
              echo "::error::release $TAG carries asset(s) outside the expected matrix:"
              echo "$unexpected"
              exit 1
            fi
          fi
          echo "ok: no unmanaged assets on $TAG"

      - name: Generate, verify and sign SHA256SUMS
        env:
          # OpenSSH ed25519 private key. Public half committed at
          # .github/release-keys/release-signing.pub. Absent -> the script
          # refuses to publish an unsigned manifest.
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: |
          set -euo pipefail
          bash .github/workflows/scripts/release-manifest.sh assets expected-assets.txt
          ls -l assets/SHA256SUMS assets/SHA256SUMS.sig

      - name: Decide release visibility (draft until complete)
        id: rel
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "draft=true" >> "$GITHUB_OUTPUT"
            else
              echo "draft=false" >> "$GITHUB_OUTPUT"
              echo "::warning::release $TAG already exists and is published — this is a repair run, so the release is visible while assets are replaced"
            fi
          else
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets + manifest to the release
        uses: softprops/action-gh-release@v2
        with:
          # assets/* is expanded in sorted order, so the manifest files (which
          # sort after "tollgate-wrt_*") are uploaded last: the manifest never
          # exists before the bytes it describes.
          files: assets/*
          fail_on_unmatched_files: true
          draft: ${{ steps.rel.outputs.draft == 'true' }}

      - name: Publish the release (only once every asset + the manifest is attached)
        if: steps.rel.outputs.draft == 'true'
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Verify what the public URL serves (the acceptance check)
        run: |
          set -euo pipefail
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          mkdir -p verify && cd verify
          curl -fsSL --retry 5 --retry-all-errors "$BASE/SHA256SUMS" -o SHA256SUMS
          diff -u ../assets/SHA256SUMS SHA256SUMS
          curl -fsSL --retry 5 --retry-all-errors "$BASE/SHA256SUMS.sig" -o SHA256SUMS.sig
          ssh-keygen -Y verify -f ../.github/release-keys/allowed_signers \
            -I release-signing@freedomtechfeed -n freedomtechfeed-release-manifest \
            -s SHA256SUMS.sig < SHA256SUMS
          # Every listed asset, fetched from the public URL, must hash to its
          # manifest entry — this is the command the audit asked for.
          while read -r _digest name; do
            curl -fsSL --retry 5 --retry-all-errors "$BASE/$name" -o "$name"
          done < SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          echo "published manifest verified against the published bytes for $TAG"
