name: Release integrity tooling

# Guards the C3-05 release-manifest code path itself. The release job only runs
# on a tag push (a 45-minute, 14-arch build), so a defect in the manifest
# tooling would otherwise be discovered only while publishing a real release.
# This runs the self-test on every change to it.
#
# The suite proves, in particular, that the release job FAILS (rather than
# publishing quietly) when an expected asset is missing, when the release
# carries an unmanaged asset, when an asset is empty, or when the signing key
# is not configured — see .github/workflows/scripts/release-manifest-test.sh,
# which records the RED (guards removed) and GREEN runs in its header.

on:
  pull_request:
    paths:
      - '.github/workflows/release-*.yml'
      - '.github/workflows/scripts/release-*'
      - '.github/release-keys/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release-*.yml'
      - '.github/workflows/scripts/release-*'
      - '.github/release-keys/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-tooling:
    name: Manifest tooling self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Manifest tooling self-test (generate, verify, sign, refuse)
        run: bash .github/workflows/scripts/release-manifest-test.sh

      - name: Committed key material is self-consistent
        run: |
          set -euo pipefail
          echo "committed release signing key: $(ssh-keygen -lf .github/release-keys/release-signing.pub)"
          key_body=$(awk '{print $2}' .github/release-keys/release-signing.pub)
          grep -qF "$key_body" .github/release-keys/allowed_signers || {
            echo "::error::allowed_signers does not pin the key in release-signing.pub — a rotation updated one file and not the other"
            exit 1
          }

      - name: Expected asset set is derivable and matches the matrix
        run: |
          set -euo pipefail
          version=$(grep '^PKG_VERSION:=' net/tollgate-wrt/Makefile | sed 's/^PKG_VERSION:=//')
          matrix=$(python3 .github/workflows/scripts/release-assets.py matrix)
          expected=$(python3 .github/workflows/scripts/release-assets.py expected "$version" | wc -l)
          matrix_count=$(printf '%s' "$matrix" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')
          echo "matrix entries=$matrix_count expected assets=$expected"
          [ "$matrix_count" = "$expected" ] || {
            echo "::error::the build matrix and the expected asset list disagree"
            exit 1
          }
