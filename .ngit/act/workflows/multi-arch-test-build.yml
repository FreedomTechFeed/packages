# ngit (Nostr) CI copy of .github/workflows/multi-arch-test-build.yml.
#
# Two adaptations for the `.ngit/act` runner -- every step is unchanged:
#
#   1. `strategy.matrix` is written out statically (single arch, x86_64). The
#      GitHub original builds it from a JSON expression, which ngit-ci cannot
#      resolve, and the coordinator serialises jobs behind a 30-minute run
#      timeout.
#   2. Nothing else was touched.
#
# KNOWN LIMITATION: the `Build` step uses `openwrt/gh-action-sdk@v11`, a
# Docker-container action, and ngit-ci jobs have no container daemon
# (docs/act-workflows.md: "There is no container daemon, so `docker` commands
# fail unless the operator opted in"). This port therefore documents the gap
# rather than claiming a working OpenWrt build on Nostr; see
# .ngit/act/workflows/README.md.
#
name: Test and Build

# Vendored from openwrt/actions-shared-workflows/.github/workflows/multi-arch-test-build.yml@main
# (commit pinned at the time of vendoring) with two deliberate changes so PR CI
# gives REAL signal about tollgate-wrt and is not blocked by a known-broken
# upstream runtime test:
#
#   1. ALWAYS build tollgate-wrt. The upstream "Determine changed packages"
#      step only builds packages whose */Makefile changed; a workflow-only PR
#      (e.g. .github/workflows/*) would fall back to generic test packages
#      (vim attendedsysupgrade-common bmon) and give ZERO signal about
#      tollgate-wrt. This feed's sole purpose is tollgate-wrt, so we always
#      build it.
#
#   2. Runtime smoke test is NON-BLOCKING (continue-on-error: true). Upstream
#      bug openwrt/actions-shared-workflows#130: runtime-test containers are
#      built from openwrt/rootfs:<arch>-<branch> images that carry a kmods feed
#      URL for the exact kernel they were built with. When the branch moves to a
#      newer kernel the old kmods dir is removed and `opkg update` 404s. Every
#      runtime test fails even though the package built fine. We keep the test
#      as a best-effort smoke check but the BUILD phase (which actually compiles
#      tollgate-wrt) is the real gate. The runtime-test container BUILD is also
#      non-blocking: openwrt/rootfs:<arch>-<branch> does not exist for every arch
#      (e.g. aarch64_cortex-a72, arm_cortex-a7, mips64_octeonplus have no rootfs
#      image on Docker Hub), so `docker build` fails with "not found" for those
#      arches even though the package built fine.
#
# The real build gate is release-publish.yml (tag-triggered, green) — this
# workflow is the PR-time signal.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  build:
    name: Test ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        # ngit-ci ADAPTATION: the GitHub original builds this matrix from a JSON
        # expression (`matrix: >- ${{ fromJSON('{"include": [...]}') }}`).
        # .ngit/act requires a STATIC matrix -- values built from expressions do
        # not resolve -- and the coordinator runs one job at a time behind a
        # 30-minute run timeout, so the 8-arch matrix is reduced to the
        # host-runnable arch. The build steps below are byte-identical to the
        # GitHub original.
          - { arch: "x86_64", target: "x86-64", runtime_test: false }

    steps:
      - name: Remove unused Android SDK, .NET, Swift, GHC
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine branch name
        run: |
          BRANCH="${GITHUB_BASE_REF#refs/heads/}"
          case "$BRANCH" in
            main|master|openwrt-[0-9]*\.[0-9]*)
              ;;
            *)
              BRANCH="master"
              ;;
          esac
          echo "Building for $BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      # This feed's sole purpose is tollgate-wrt. Always build it so every PR
      # gives real signal about the package regardless of which paths changed.
      # (The upstream shared workflow only builds packages whose */Makefile
      # changed, so a workflow-only PR would build generic test packages and
      # give ZERO signal about tollgate-wrt.)
      - name: Determine packages
        run: |
          PACKAGES="tollgate-wrt"
          echo "Building $PACKAGES"
          echo "PACKAGES=$PACKAGES" >> $GITHUB_ENV

      - name: Build
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}-${{ env.BRANCH }}
          FEEDNAME: packages_ci
          INDEX: 1
          V: s

      - name: Move created packages to project dir
        if: always()
        run: cp -v bin/packages/${{ matrix.arch }}/packages_ci/* . || true

      - name: Collect metadata
        if: always()
        run: |
          MERGE_ID=$(git rev-parse --short HEAD)
          echo "MERGE_ID=$MERGE_ID" >> $GITHUB_ENV
          echo "BASE_ID=$(git rev-parse --short HEAD^1)" >> $GITHUB_ENV
          echo "HEAD_ID=$(git rev-parse --short HEAD^2)" >> $GITHUB_ENV
          PRNUMBER=${GITHUB_REF_NAME%/merge}
          echo "PRNUMBER=$PRNUMBER" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${{matrix.arch}}-PR$PRNUMBER-$MERGE_ID" >> $GITHUB_ENV

      - name: Generate metadata
        if: always()
        run: |
          cat << _EOF_ > PKG-INFO
          Metadata-Version: 2.1
          Name: ${{env.ARCHIVE_NAME}}
          Version: $BRANCH
          Author: $GITHUB_ACTOR
          Home-page: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PRNUMBER
          Download-URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Summary: $PACKAGES
          Platform: ${{ matrix.arch }}

          Packages for OpenWrt $BRANCH running on ${{matrix.arch}}, built from PR $PRNUMBER
          at commit $HEAD_ID, against $BRANCH at commit $BASE_ID, with merge SHA $MERGE_ID.

          Modified packages:
          _EOF_
          for p in $PACKAGES
          do
            echo "  "$p >> PKG-INFO
          done
          echo >> PKG-INFO
          echo Full file listing: >> PKG-INFO
          ls -al *.ipk >> PKG-INFO || true
          ls -al *.apk >> PKG-INFO || true
          cat PKG-INFO

      - name: Store packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARCHIVE_NAME}}-packages
          path: |
            Packages
            Packages.*
            *.ipk
            packages.adb
            *.apk
            PKG-INFO

      - name: Store logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARCHIVE_NAME}}-logs
          path: |
            logs/
            PKG-INFO

      - name: Remove logs
        if: always()
        run: sudo rm -rf logs/ || true

      - name: Check if any packages were built
        run: |
          if [ -n "$(find . -maxdepth 1 -type f -name '*.apk' -print -quit)" ]; then
            echo "Found *.apk files"
            HAVE_PKGS=true
            PKG_MANAGER=apk
          elif [ -n "$(find . -maxdepth 1 -type f -name '*.ipk' -print -quit)" ]; then
            echo "Found *.ipk files"
            HAVE_PKGS=true
            PKG_MANAGER=opkg
          else
            echo "No *.apk or *.ipk files found"
            HAVE_PKGS=false
          fi
          echo "HAVE_PKGS=$HAVE_PKGS" >> $GITHUB_ENV
          echo "PKG_MANAGER=$PKG_MANAGER" >> $GITHUB_ENV

      - name: Register QEMU
        if: ${{ matrix.runtime_test && fromJSON(env.HAVE_PKGS) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --import

      - name: Checkout test scripts
        if: ${{ matrix.runtime_test && fromJSON(env.HAVE_PKGS) }}
        uses: actions/checkout@v7
        with:
          repository: openwrt/actions-shared-workflows
          path: workflow_context
          sparse-checkout: |
            .github/scripts/ci_helpers.sh
            .github/dockerfiles/Dockerfile.feeds
            .github/scripts/test_entrypoint.sh
          sparse-checkout-cone-mode: false

      # Runtime-test container build. Also NON-BLOCKING (continue-on-error: true)
      # for the same reason as the test below: the openwrt/rootfs:<arch>-<branch>
      # image does not exist for every arch (e.g. aarch64_cortex-a72,
      # arm_cortex-a7, mips64_octeonplus have no rootfs image on Docker Hub), so
      # `docker build` fails with "not found" even though the package built fine.
      # This is upstream runtime-test infra, not a failure of our package. The
      # BUILD phase (which actually compiles tollgate-wrt) is the real gate.
      - name: Build Docker container
        if: ${{ matrix.runtime_test && fromJSON(env.HAVE_PKGS) }}
        continue-on-error: true
        run: |
          docker build \
            --build-arg ARCH \
            --file workflow_context/.github/dockerfiles/Dockerfile.feeds \
            --platform linux/${{ matrix.arch }} \
            --tag test-container \
            workflow_context/.github
        env:
          ARCH: ${{ matrix.arch }}-${{ env.BRANCH }}

      # Runtime smoke test. KNOWN-BROKEN upstream (openwrt/actions-shared-workflows#130):
      # the rootfs image carries a kmods feed URL for the exact kernel it was built
      # with; when the branch moves to a newer kernel the old kmods dir 404s and
      # `opkg update` fails. This is NOT a failure of our package. We keep the test
      # as a best-effort smoke check but make it NON-BLOCKING (continue-on-error)
      # so the build phase — which actually compiles tollgate-wrt — is the gate.
      - name: Test via Docker container
        if: ${{ matrix.runtime_test && fromJSON(env.HAVE_PKGS) }}
        continue-on-error: true
        run: |
          docker run \
            -e ENABLE_GENERIC_TESTS=true \
            -e FORCE_GENERIC_TESTS=true \
            -e PKG_MANAGER=${{ env.PKG_MANAGER }} \
            --platform linux/${{ matrix.arch }} \
            --rm \
            --volume $GITHUB_WORKSPACE:/ci \
            test-container
